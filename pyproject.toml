[project]
name = "proto-grid"
version = "0.2.0"
description = "PROTO: cost-aware paired buy-low/sell-high equity grid on HOSE, naive vs faithful (Plutus) execution"
requires-python = ">=3.12"
dependencies = [
    "algotrade-plutus",
    "duckdb>=1.0",
    "pyarrow>=12",
]

[project.scripts]
pg-backtest = "proto_grid.backtest:main"
pg-anchor = "proto_grid.experiments.grid_anchor:main"

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv.sources]
# The engine. Install it editable from a plutus-simulator checkout on rivf26.
algotrade-plutus = { path = "../../plutus-simulator", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proto_grid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
